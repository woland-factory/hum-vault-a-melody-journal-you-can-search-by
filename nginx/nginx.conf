server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Health endpoint for the deploy healthcheck.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Runtime config is regenerated at container start, so never cache it.
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # Hashed build assets are safe to cache for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The model and soundfont are large and stable; cache them.
    location /model/ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location /soundfont/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }
}
